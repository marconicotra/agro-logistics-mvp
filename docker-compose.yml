version: "3.9"

services:
  db:
    image: postgres:15
    container_name: agro_postgres
    restart: always
    environment:
      POSTGRES_DB: agro_logistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
