[project]
name = "agro-logistics-mvp"
version = "0.1.0"
description = "Backend bootstrap for AGRO Logistics MVP."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "openai>=1.93.0",
    "PyJWT[crypto]>=2.10.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
